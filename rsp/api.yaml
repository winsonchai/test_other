apiVersion: apps/v1
kind: Deployment
metadata:
  name: scenarioiq-api 
  namespace: dev-ui
  labels:
    app: scenarioiq-api
    env: scenarioiq-api 
spec:
  replicas: 1 
  strategy:
    type: Recreate
  selector:
    matchLabels:
      app: scenarioiq-api
      env: scenarioiq-api
  template:
    metadata:
      labels:
        app: scenarioiq-api
        env: scenarioiq-api
    spec:
      imagePullSecrets:
      - name: shihua-registry-secret
      containers:
      - name: scenarioiq-api
        image: artifactory.wdc.com:6570/tpt_api_v2.1
        command: ["/bin/sh"]
        args:
        - "-c"
        - "cd /usr/src/app && npm run start:prod > /tmp/npm.log 2>&1; cat /tmp/npm.log; while sleep 10; do date -u +%T; done"
        ports:
        - containerPort: 3000
          name: tpt-api
        imagePullPolicy: Always
        env:
        - name: NODE_ENV
          value: "development"
        - name: PORT
          value: "3000"
        - name: API_PREFIX
          value: "api/v1"
        - name: APP_NAME
          value: "RPS Backend Boilerplate (Development)"
        - name: APP_VERSION
          value: "1.0.0"
        - name: PORTKEY_API_KEY
          value: "0c4DfsiWxJ4Ore47ctS/+7g7x2vl"
