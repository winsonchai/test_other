apiVersion: networking.k8s.io/v1
kind: Ingress
metadata:
  name: node-app-ingress
  namespace: dev-ui
  annotations:
    kubernetes.io/ingress.class: "nginx" # 🏢 Keeps routing bound to the Nginx controller
spec:
  rules:
  - host: my-node-app.10.248.40.220.nip.io # 🌐 Magic domain mapping directly to your server IP
    http:
      paths:
      - path: /
        pathType: Prefix
        backend:
          service:
            name: node-app-service
            port:
              number: 80