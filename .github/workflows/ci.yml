name: Local Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-compile:
    # Tells 'act' to execute directly on your local machine's OS
    runs-on: local
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Build and Run Container Tests
        run: |
          docker build --target tester -t local-app:test .

      - name: Build Production Artifact
        run: |
          docker build --target runner -t local-sandbox-app:latest .
          
      - name: Secret Presence Check
        env:
          MY_SECRET: ${{ secrets.DATABASE_DECRYPT_KEY }}
        run: |
          echo "Checking secret injection engine..."