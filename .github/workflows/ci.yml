name: Local Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      - name: Setup Docker Buildx
        uses: docker/setup-buildx-action@v3

      # Test stage runs inside Docker context
      - name: Build and Run Container Tests
        uses: docker/build-push-action@v6
        with:
          context: .
          target: tester
          load: true
          cache-from: type=gha
          cache-to: type=gha,mode=max

      # Production compilation runs ONLY if tester stage passes
      - name: Build Production Artifact
        uses: docker/build-push-action@v6
        with:
          context: .
          target: runner
          tags: local-sandbox-app:latest
          outputs: type=docker
          cache-from: type=gha
          cache-to: type=gha,mode=max
          
      # Verify secret injection without printing the actual value to stdout
      - name: Secret Presence Check
        env:
          MY_SECRET: ${{ secrets.DATABASE_DECRYPT_KEY }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "❌ CRITICAL: Migration Secret Missing!"
            exit 1
          else
            echo "✅ Security Validation: Secret Injected via Context Engine."
          fi