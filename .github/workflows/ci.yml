name: Local Sandbox CI

on:
  push:
    branches: [ main ]
  pull_request:
    branches: [ main ]

jobs:
  validate-and-compile:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Repository
        uses: actions/checkout@v4

      # Instead of using an external marketplace action, run native docker commands directly!
      - name: Build and Run Container Tests
        run: |
          docker build --target tester -t local-app:test .

      - name: Build Production Artifact
        run: |
          docker build --target runner -t local-sandbox-app:latest .
          
      - name: Secret Presence Check
        env:
          MY_SECRET: ${{ secrets.DATABASE_DECRYPT_KEY }}
        run: |
          if [ -z "$MY_SECRET" ]; then
            echo "❌ CRITICAL: Migration Secret Missing!"
            exit 1
          else
            echo "✅ Security Validation: Secret Injected via Context Engine."
          fi